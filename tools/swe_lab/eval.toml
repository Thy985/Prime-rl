# Evaluate a model on the three swe-lab tiers through verifiers v1.
# The model endpoint comes from .env (repo root): the router is Windows-hosted, so
# WSL must use the Windows host IP, and it streams by default.
#
#   set -a; . ./.env; set +a
#   PYTHONPATH=tools/swe_lab_env DUMMY_API_KEY="$TENXUN_API_KEY" \
#   uv run eval @ tools/swe_lab/eval.toml \
#     --model "$TENXUN_MODEL" --client.base_url "$TENXUN_BASE_URL"
#
# REQUIRED for external routers: pin concurrency below the provider's cap.
#   --concurrency.min-inflight 4 --concurrency.max-inflight 4
# prime-rl eval pins in-flight episodes at 128 by default; when the upstream allows
# fewer (this router allows 6) the excess requests fail with
# "429 concurrent limit exceeded" and the errored episodes are silently scored as
# model failures unless they are excluded.
#
# num_examples = one episode per tier; group_size = independent attempts per tier.
# Temperature is non-zero on purpose: at 0.0 the attempts are identical and the
# extra samples carry no information about solve rate.

model = "Tenxun/Deepseek-v4-flash"
num_examples = 4
group_size = 8

[client]
base_url = "http://172.20.208.1:20128/v1"
api_key_var = "DUMMY_API_KEY"

[sampling]
max_completion_tokens = 8192
temperature = 0.7

[[source]]
name = "swe-lab"
env.taskset.id = "swe-lab"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"