# Harness D: the same allowance as the budgeted Harness A (max_turns = 4), spent
# through a plan -> execute -> feedback protocol instead of one free-form loop.
# The design and the three predictions recorded before this config was first run
# live in tools/swe_lab_env/swe_lab_planner_executor.py.
#
#   H_A, max_turns = 4   tier1 8/8 | tier2 8/8 | tier3 1/8 | tier4 6/8 | tier5 1/8
#   H_D, max_turns = 4   <- this config
#
# H_D is neither a budget change nor a prompt hint: the harness program owns the phase
# boundaries, refuses write commands during planning, and withholds the edit tool until
# the execution phase. The recorded H_A baseline is tools/swe_lab/runs/frontier_budget.json.

model = "9router/dots3-note-prev"
num_examples = 5
group_size = 8

[client]
base_url = "http://172.20.208.1:20128/v1"
api_key_var = "DUMMY_API_KEY"

[sampling]
max_completion_tokens = 8192
temperature = 0.0

[[source]]
name = "swe-lab"
env.taskset.id = "swe-lab"
env.taskset.mode = "patch"
env.agent.harness.id = "swe-lab-planner-executor"
env.agent.runtime.type = "subprocess"
env.agent.max_turns = 4