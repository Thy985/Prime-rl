# Harness C: identical to eval_patch_noedit.toml (bash, edit disabled, same model,
# taskset and budgets) except the harness states the completion requirement.
#
#   H_A  bash + edit                              -> solve 16/16, no-write 0
#   H_B  bash, edit disabled                      -> solve  9/16, no-write 7
#   H_C  bash, edit disabled + completion bound   -> ?
#
# The falsifiable prediction: if the failures were abandonment rather than bad
# patches, binding the completion condition should lower no-write.

model = "9router/dots3-note-prev"
num_examples = 4
group_size = 8

[client]
base_url = "http://172.20.208.1:20128/v1"
api_key_var = "DUMMY_API_KEY"

[sampling]
max_completion_tokens = 8192
temperature = 0.0

[[source]]
name = "swe-lab"
env.taskset.id = "swe-lab"
env.taskset.mode = "patch"
env.agent.harness.id = "swe-lab-patch-first"
env.agent.harness.edit = false
env.agent.runtime.type = "subprocess"