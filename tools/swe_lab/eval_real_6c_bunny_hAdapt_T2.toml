# Harness ADAPT: deterministic affordance scheduler on the 20-instance wide set.
#
# Same tools, runtime, budget and neutral prompts as the free agent (H_A), but
# the per-turn tool list is decided by the controller from the observed
# trajectory: RECON [bash] until repeated inspection or budget pressure, EXECUTE
# [bash, edit], VERIFY [bash] on the last turn when an edit exists but no test
# ever ran. SWE_LAB_BUDGET must match env.agent.max_turns.
#
#   bash /tmp/run_swe_eval.sh tools/swe_lab/eval_real_hAdapt.toml --run.name rl-adapt-hA -c 1 --clean -n 20 -r 1

model = "openrouter/stealth/space-bunny-alpha"
num_examples = 20
group_size = 1

[client]
base_url = "http://172.20.208.1:20128/v1"
api_key_var = "DUMMY_API_KEY"

[sampling]
max_completion_tokens = 8192
temperature = 0.0

[[source]]
name = "swe-bench"
env.taskset.id = "swe_bench"
env.agent.harness.id = "swe-lab-adaptive-executor"
env.agent.harness.env = { SWE_LAB_BUDGET = "2" }
env.agent.runtime.type = "subprocess"
env.agent.max_turns = 2
env.agent.timeout.rollout = 600